 app.innerHTML=`<h2>🧮 MRP run</h2><p class="mu">Explodes the BOM of every open Sales Order, then nets off stock on hand and open requisitions.</p><div class="card wrap"><table><tr><th>Item</th><th>Gross need</th><th>On hand</th><th>On order (PR)</th><th>Shortage</th></tr>${rows.map(r=>`<tr><td>${esc(r.c)}</td><td>${r.g}</td><td>${r.oh}</td><td>${r.op}</td><td>${r.net?`<span class="tag bad">${r.net}</span>`:'<span class="tag good">OK</span>'}</td></tr>`).join("")||'<tr><td colspan=5 class="mu">No open Sales Orders with a part code.</td></tr>'}</table></div>${w?`<div class="row"><button class="p" id="r1"${sh.length?"":" disabled"}>Run &amp; raise ${sh.length} PR(s)</button><button id="r2"${rows.length?"":" disabled"}>Save run only</button></div>`:""}<h3>Previous runs</h3><div class="card wrap"><table>${ds.map(d=>`<tr class="r" data-id="${d.id}"><td>${d.id}</td><td>${esc(d.v.date)}</td><td>${d.v.short} short</td><td>${d.v.prs} PR</td></tr>`).join("")||'<tr><td class="mu">None yet</td></tr>'}</table></div>`;

 return{mode:"This device only",sub(f){cb=f;f(rd())},save(d){const a=rd().filter(x=>x.id!==d.id);a.push(d);wr(a)},del(id){wr(rd().filter(x=>x.id!==id))}}}
async function init(){let db=null;try{db=await claude.use("db")}catch(e){}

function prefill(from,to){const v=from.v,o={};
 if(from.m==="sq"&&to==="so")o.sq=from.id;else if(from.m==="so")o.so=from.id;
 if(from.m==="cu")Object.assign(o,{customer:v.name,gstin:v.gstin,bill:v.bill,ship:v.ship,pay:v.credit?v.credit+" days":"",contact:v.contact,phone:v.phone});
 if(from.m==="sp")o.vendor=v.name;
 if(from.m==="it"){o.part=v.code;o.drawing="";o.bom=v.code}
 if(from.m==="sq")Object.assign(o,{customer:v.customer,part:v.part,qty:v.qty,total:v.total,pay:v.pay,gst:v.gst});
 if(from.m==="so")Object.assign(o,{customer:v.customer,part:v.part,item:v.part,qty:v.qty,gstin:v.gstin,gst:v.gst,rate:v.qty?Math.round(v.total/v.qty/(1+(v.gst||0)/100)*100)/100:"",contents:v.part});
 if(from.m==="pr")Object.assign(o,{pr:from.id,item:v.item,qty:v.qty,vendor:v.vendor});
 if(from.m==="po")Object.assign(o,{po:from.id,company:v.vendor,mcode:v.item,qty:v.qty,amount:v.total});
 if(from.m==="wo"){o.so=v.so;o.wo=from.id;o.item=v.part;o.qtyIns=v.qty;o.customer=(docs.find(d=>d.id===v.so)||{v:{}}).v.customer;o.serials=v.serials}
 if(from.m==="pi")Object.assign(o,{so:v.so,customer:v.customer,part:v.part,qty:v.qty,rate:v.rate,gst:v.gst});
 if(to==="sv")delete o.so;
 return o}

 <div class="row"><button class="p" id="sv">Save</button>${m.btn?`<button id="bt">${m.btn[0]}</button>`:""}<button id="adv">Save & next stage ▸</button>${d._new?"":`<button class="d" id="dl" style="margin-left:auto">Delete</button>`}</div>
